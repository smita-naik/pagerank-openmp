name: Correctness
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test with GCC/OpenMP
        run: make CXX=g++ -j2 test
      - name: Address and undefined behavior sanitizers
        run: make CXX=g++ sanitize
